<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1e293b; }
      .layer { font-size: 13px; font-weight: bold; }
      .t { font-size: 13px; fill: #1e293b; }
      .s { font-size: 10.5px; fill: #64748b; }
      .tag { font-size: 9.5px; font-weight: bold; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#15803d"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="760" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" class="title">异构多智能体协作架构 · 总控—调度—执行三层 + 三轮审核循环</text>

  <!-- ═══ 任务入口 ═══ -->
  <rect x="380" y="52" width="200" height="38" rx="19" fill="#1e293b"/>
  <text x="480" y="76" text-anchor="middle" fill="#fff" class="t">用户任务输入</text>
  <line x1="480" y1="90" x2="480" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ 总控层 ═══ -->
  <rect x="60" y="110" width="840" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="80" y="135" class="layer" fill="#4338ca">总控层 · DeepSeek 总控 Agent（不插手实质工作）</text>
  <rect x="90" y="148" width="180" height="42" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="180" y="166" text-anchor="middle" class="t">任务审查与分发</text>
  <text x="180" y="182" text-anchor="middle" class="s">高效清晰拆解用户需求</text>
  <rect x="290" y="148" width="180" height="42" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="380" y="166" text-anchor="middle" class="t">日志定期巡检</text>
  <text x="380" y="182" text-anchor="middle" class="s">发现停滞→调度备用顶替</text>
  <rect x="490" y="148" width="180" height="42" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="580" y="166" text-anchor="middle" class="t">最终裁决</text>
  <text x="580" y="182" text-anchor="middle" class="s">三轮审核后一锤定音</text>
  <rect x="690" y="148" width="180" height="42" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="780" y="166" text-anchor="middle" class="t">审查归档分类</text>
  <text x="780" y="182" text-anchor="middle" class="s">总结上报 · 沉淀经验</text>

  <!-- ═══ 调度层 ═══ -->
  <line x1="480" y1="202" x2="480" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="224" width="840" height="92" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="249" class="layer" fill="#b45309">调度层 · 任务特征分析 + 能力画像分配</text>
  <rect x="90" y="262" width="190" height="42" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="185" y="279" text-anchor="middle" class="t">GLM · 任务分类与提示词</text>
  <text x="185" y="295" text-anchor="middle" class="s">提取关键特征 · 整理分类</text>
  <rect x="300" y="262" width="250" height="42" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="425" y="279" text-anchor="middle" class="t">DeepSeek · 能力画像分配</text>
  <text x="425" y="295" text-anchor="middle" class="s">主负责 69% · 次责 30% · 辅助 1%（可调参数）</text>
  <rect x="570" y="262" width="150" height="42" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="645" y="279" text-anchor="middle" class="t">API 统一管理</text>
  <text x="645" y="295" text-anchor="middle" class="s">职能范围隔离</text>
  <rect x="740" y="262" width="130" height="42" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="805" y="279" text-anchor="middle" class="t">Gemini 运维</text>
  <text x="805" y="295" text-anchor="middle" class="s">整体架构运维</text>

  <!-- ═══ 执行层 ═══ -->
  <line x1="480" y1="316" x2="480" y2="336" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="338" width="840" height="104" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="80" y="363" class="layer" fill="#15803d">执行层 · 多模块并行（各 Agent 同时运行）</text>
  <rect x="90" y="376" width="240" height="52" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="210" y="397" text-anchor="middle" class="t">文字模块</text>
  <text x="210" y="416" text-anchor="middle" class="s">GLM（通义千问 备选）</text>
  <rect x="360" y="376" width="240" height="52" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="480" y="397" text-anchor="middle" class="t">视觉模块</text>
  <text x="480" y="416" text-anchor="middle" class="s">Kimi · 通义千问</text>
  <rect x="630" y="376" width="240" height="52" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="750" y="397" text-anchor="middle" class="t">图表模块</text>
  <text x="750" y="416" text-anchor="middle" class="s">文心一言 · MiniMax</text>

  <!-- ═══ 审核循环 ═══ -->
  <line x1="480" y1="442" x2="480" y2="462" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="464" width="840" height="270" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="80" y="489" class="layer" fill="#c2410c">质量循环 · 三轮审核（Self-Loop）</text>

  <!-- 循环节点（环形布局） -->
  <rect x="100" y="510" width="160" height="52" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="180" y="531" text-anchor="middle" class="t">① 成品产出</text>
  <text x="180" y="550" text-anchor="middle" class="s">各模块并行完成</text>

  <rect x="330" y="510" width="170" height="52" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="415" y="531" text-anchor="middle" class="t">② 轮流审核</text>
  <text x="415" y="550" text-anchor="middle" class="s">全员轮流审核一轮</text>

  <rect x="570" y="510" width="190" height="52" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="665" y="531" text-anchor="middle" class="t">③ 建议 Agent 给方案</text>
  <text x="665" y="550" text-anchor="middle" class="s">提出修改建议与解决案</text>

  <rect x="570" y="600" width="190" height="52" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="665" y="621" text-anchor="middle" class="t">④ 主负责 Agent 审议</text>
  <text x="665" y="640" text-anchor="middle" class="s">转递审议 · 决定是否定稿</text>

  <rect x="330" y="600" width="170" height="52" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="415" y="621" text-anchor="middle" class="t">⑤ 未达标 → 回环</text>
  <text x="415" y="640" text-anchor="middle" class="s">重复 ①-④，最多 3 轮</text>

  <rect x="100" y="600" width="160" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="180" y="621" text-anchor="middle" class="t">⑥ 总控一锤定音</text>
  <text x="180" y="640" text-anchor="middle" class="s">达标 → 裁决通过</text>

  <!-- 循环箭头 -->
  <line x1="260" y1="536" x2="328" y2="536" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="500" y1="536" x2="568" y2="536" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="665" y1="562" x2="665" y2="598" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="568" y1="626" x2="502" y2="626" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="328" y1="626" x2="262" y2="626" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <!-- 回环：⑤→① 从底部绕 -->
  <path d="M 415 652 L 415 690 L 180 690 L 180 564" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrO)"/>
  <text x="300" y="685" text-anchor="middle" class="s" fill="#c2410c">未达标回环（≤3轮）</text>

  <!-- ⑥→归档 -->
  <path d="M 180 652 L 180 700 L 480 700 L 480 736" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="330" y="716" width="300" height="34" rx="8" fill="#1e293b"/>
  <text x="480" y="738" text-anchor="middle" fill="#fff" class="t">DeepSeek 终审归档 · 经验沉淀</text>
</svg>
